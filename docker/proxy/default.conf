# Forward every path to the API, which serves both /api and the compiled UI.
# The proxy serves no files; it adds only nginx's version-free Server header.
server {
    listen 8080;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Overwrite, never append: the API trusts only this hop (TRUST_PROXY).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Stream bodies, so the API rejects a request before reading it (A07).
        proxy_request_buffering off;
    }
}
