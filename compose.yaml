# `docker compose up --wait` builds the images on first use and runs the whole
# application at http://localhost:8080 with no host Node (Architecture A12).
# Add --build after pulling changes. The Node workflow and CI start only the
# database: `docker compose up -d mongodb`.
name: easy-generator

services:
  mongodb:
    build:
      context: .
      dockerfile: docker/mongodb/Dockerfile
    # app, proxy, and mongodb-init share this service's network namespace, so
    # the API keeps its loopback listener and the replica set keeps advertising
    # localhost:27018. Compose allows ports only here, on the namespace owner.
    ports:
      - '127.0.0.1:27018:27018'
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      # Named per major version: 7.0 cannot open data files written by 8.0.
      - mongodb-data-7.0:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--port',
          '27018',
          '--eval',
          "const h = db.hello(); quit(h.isWritablePrimary && h.setName === 'easy-generator-rs' ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Initializes or verifies the replica set once, like `npm run db:ready`.
  mongodb-init:
    # Built like `mongodb` (same layers, from cache), so it works under any
    # project name and is never pulled from a registry.
    build:
      context: .
      dockerfile: docker/mongodb/Dockerfile
    network_mode: service:mongodb
    command:
      [
        'mongosh',
        '--nodb',
        '--quiet',
        '--file',
        '/opt/easy-generator/wait-and-init.js',
      ]
    depends_on:
      mongodb:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    network_mode: service:mongodb
    # The loopback preview of Architecture A02: no Secure cookie and no HSTS,
    # so the origin must stay on localhost.
    environment:
      NODE_ENV: development
      PORT: '3000'
      SERVE_WEB: 'true'
      APP_ORIGIN: http://localhost:${APP_PORT:-8080}
      TRUST_PROXY: 127.0.0.1
      MONGODB_URI: mongodb://localhost:27018/easy_generator?replicaSet=easy-generator-rs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    network_mode: service:mongodb
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--spider',
          'http://127.0.0.1:8080/api/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

volumes:
  mongodb-data-7.0:
