name: easy-generator

services:
  mongodb:
    # MongoDB 8.0 refuses to start on Linux kernels 6.19 through 7.0.13
    # (SERVER-121912), which current CI runners and Linux hosts run; 7.0 does not.
    image: mongo:7.0.45@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
    command:
      [
        'mongod',
        '--replSet',
        'easy-generator-rs',
        '--bind_ip_all',
        '--port',
        '27018',
      ]
    ports:
      - '127.0.0.1:27018:27018'
    volumes:
      # Named per major version: 7.0 cannot open data files written by 8.0.
      - mongodb-data-7.0:/data/db
      - ./scripts/mongo-init.js:/opt/easy-generator/mongo-init.js:ro
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--port',
          '27018',
          '--eval',
          "const h = db.hello(); quit(h.isWritablePrimary && h.setName === 'easy-generator-rs' ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongodb-data-7.0:
